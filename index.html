<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartas à Mão">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D5D0BF">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Cartas à Mão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma coluna estreita, como a face de um aparelho. Decks em blocos (bento) com leds de contagem, botões redondos como teclas, laranja só na ação principal. */
:root {
  --bg: #D5D0BF;
  --panel: #E3DECD;
  --card: #EEE9D8;
  --ink: #23211C;
  --ink-2: #54503F;
  --line: #B9B29E;
  --accent: #DC5019;
  --raise: var(--bg); --rim: transparent;
  --accent-ink: #23211C;
  --shade: rgba(70,60,40,.40); --glow: rgba(255,255,255,.80);
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2D2D2D; --panel: #383838; --card: #404040; --raise: #383838; --rim: transparent; --ink: #F2F2F2; --ink-2: #9B9B9B;
    --line: #4F4F4F; --accent: #FF6B2C; --accent-ink: #1E1E1E; --shade: rgba(0,0,0,.50); --glow: rgba(255,255,255,.06); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2D2D2D; --panel: #383838; --card: #404040; --raise: #383838; --rim: transparent; --ink: #F2F2F2; --ink-2: #9B9B9B;
  --line: #4F4F4F; --accent: #FF6B2C; --accent-ink: #1E1E1E; --shade: rgba(0,0,0,.50); --glow: rgba(255,255,255,.06); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.4 var(--f-body);
  padding-block: 8px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; min-width: 0; }
.ico { display: inline-grid; place-items: center; }
.label { font: 500 11px/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }

/* Home */
.masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 0 16px; flex-wrap: wrap; }
/* Nada de seleção de texto nem menu de copiar/colar ao segurar a tela; só nos campos de digitar. */
html, body, #app, .sheet, .toast, img, svg, canvas, button { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
input, textarea, [contenteditable="true"] { -webkit-touch-callout: default; -webkit-user-select: text; user-select: text; }
.masthead .status { flex: 0 0 100%; padding-bottom: 0; }
.brand { font: 800 34px/1 var(--f-display); letter-spacing: -.03em; margin: 8px 0 0; text-wrap: balance; }
.label.pos { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink); }
.mast-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.status { display: flex; align-items: center; gap: 8px; font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); padding-bottom: 4px; }
.led { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-2); flex: none; }
.led.on { background: var(--accent); border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; min-height: 156px; min-width: 0; }
.tile-main { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 12px; width: 100%; height: 100%; min-height: 156px; padding: 16px; text-align: left; border-radius: 16px; }
.tile-name { font: 700 21px/1.08 var(--f-display); letter-spacing: -.02em; padding-right: 30px; overflow-wrap: anywhere; text-wrap: balance; }
.tile-foot { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.tile-meta { font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.dots i.off { background: transparent; border: 1px solid var(--ink-2); }
.tile-edit { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); }
.tile-top { display: flex; flex-direction: column; gap: 4px; min-width: 0; width: 100%; }
.tile-desc { font: 400 12.5px/1.3 var(--f-body); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile.compact, .tile.compact .tile-main { min-height: 118px; }
.tile.compact .tile-main { padding: 12px; gap: 8px; }
.tile.compact .tile-name { font-size: 17px; padding-right: 0; }
.tile.compact .tile-foot { gap: 8px; }
.grp { grid-column: 1 / -1; margin: 12px 0 0; }
.grp:first-child { margin-top: 0; }
.ctl-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; margin: 0 0 12px; }
.ctl-row .led-toggle { display: block; min-width: 0; padding: 0; line-height: 44px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Rótulo que muda de texto sem mexer no que está em volta: o espaço é sempre o do texto mais longo. */
.sizer { display: inline-grid; text-align: left; }
.sizer > * { grid-area: 1 / 1; }
.sizer > .ghost { visibility: hidden; pointer-events: none; }
.ctl-row .led-toggle b { font-weight: 500; color: var(--ink); border-bottom: 1px dotted var(--ink-2); }
.act.sel { border-color: var(--ink); background: var(--panel); }
.field-gap { margin-top: 8px; }
.tile.new { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tile.new .tile-main { justify-content: space-between; }
.tile.new .tile-name { padding-right: 0; }
.note { font: 400 12px/1.5 var(--f-mono); color: var(--ink-2); margin: 16px 0 0; max-width: 40ch; }

/* Barras e botões */
.bar { display: flex; align-items: center; gap: 12px; padding-block: 8px; }
.bar .grow { flex: 1; min-width: 0; }
.title-btn { display:flex; align-items:center; gap:6px; max-width:100%; margin-top:4px; padding:0; border:0; background:none; color:inherit; font:700 20px/1.15 var(--f-display); letter-spacing:-.02em; text-align:left; cursor:pointer; }
.title-btn .bar-title-txt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.title-btn svg { flex:none; opacity:.45; }
.bar-title { font: 700 20px/1.15 var(--f-display); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.round { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--panel); display: grid; place-items: center; flex: none; }
.round:disabled { opacity: .35; }
.round:active:not(:disabled) { transform: scale(.96); }
.btn { min-height: 52px; padding: 0 22px; border-radius: 26px; border: 1.5px solid var(--ink); background: var(--panel); font: 600 16px/1 var(--f-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .38; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.wide { flex: 1; }
.led-toggle { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 4px; font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }

/* Cartas */
.stage { position: relative; width: min(100%, max(240px, calc((100dvh - var(--reserve, 270px)) * .8))); aspect-ratio: 4 / 5; margin: 8px auto 0; max-width: 100%; }
.stage.study { perspective: 1400px; cursor: pointer; margin-top: 16px; }
.flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3, .7, .2, 1); }
.flip.is-flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; }
.face.back { transform: rotateY(180deg); }
.face-label { position: absolute; top: 14px; left: 16px; font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); z-index: 1; }
.face canvas, .thumb canvas, .paper canvas { width: 100%; height: 100%; display: block; }
.txt { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; white-space: pre-wrap; overflow: hidden; padding: 0 7%; font: 800 40px/1.18 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 24px; }
.controls .btn { min-width: 150px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.panel h2 { font: 800 26px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.panel p { margin: 0; color: var(--ink-2); max-width: 36ch; }
.panel .row-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 0; }
.panel .res-actions { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.res-actions .btn { padding: 0 10px; font-size: 15px; line-height: 1.15; text-align: center; min-width: 0; }
.res-actions .btn.primary { grid-column: 1 / -1; }

/* Editor de carta */
.steps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 12px; }
.step { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid var(--line); font: 500 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.step .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid currentColor; font-size: 11px; }
.step[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.paper { position: relative; width: 100%; height: 100%; background-color: var(--card); background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 24px 24px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.paper canvas { touch-action: none; -webkit-user-select: none; user-select: none; cursor: crosshair; }
.type { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; resize: none; overflow: hidden; text-align: center; padding: 0 7%; font: 800 40px/1.18 var(--f-display); letter-spacing: -.02em; color: var(--ink); caret-color: var(--accent); outline: none; }
.type::placeholder { color: var(--ink-2); font-family: var(--f-body); font-weight: 500; font-size: inherit; line-height: inherit; letter-spacing: 0; }
.app.kb .bar { padding-block: 0 2px; }
.app.kb .bar .round { width: 40px; height: 40px; }
.app.kb .steps { margin: 4px 0 8px; }
.app.kb .stage.edit { margin-top: 0; }
.app.kb .tools { margin-top: 8px; }
.stage.edit { transition: height .2s ease; }
.edbox { --ew: min(100%, max(110px, calc((var(--vh, 100dvh) - var(--reserve, 330px)) * .8))); }
.edbox .stage.edit, .edbox .steps, .edbox .tools { width: var(--ew); margin-left: auto; margin-right: auto; box-sizing: border-box; }
.tool.icon { width: 38px; padding: 0; justify-content: center; }
.tool.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 22px; overflow: hidden; }
.seg button { min-height: 40px; padding: 0 10px; font: 500 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tool-btns { display: flex; gap: 8px; }
.tool { min-height: 40px; padding: 0 10px; border-radius: 20px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.tool:disabled { opacity: .35; }
.palette { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; padding: 0 12px; box-sizing: border-box; pointer-events: none; z-index: 2; }
.palette .pens, .palette .sws { pointer-events: auto; }
.palette .sws { align-self: center; margin-bottom: 0; }
.sws { display: flex; align-items: center; gap: 2px; position: relative; }
.sws::before { content: ''; position: absolute; left: 12px; right: 12px; top: 50%; height: 1.5px; margin-top: -.75px; background: var(--ink); }
.sw { position: relative; width: 24px; height: 24px; border-radius: 50%; flex: none; border: 0; padding: 0; transform: scale(.84); transition: transform .15s ease; box-shadow: 3px 1px 7px var(--shade), -3px -1px 7px var(--glow); }
.sw[aria-pressed="true"] { transform: scale(1.12); box-shadow: 4px 1.5px 9px var(--shade), -4px -1.5px 9px var(--glow); }
@media (prefers-reduced-motion: reduce) { .sw { transition: none; } }
.pens { display: flex; align-items: flex-end; gap: 2px; height: 44px; overflow: hidden; margin-bottom: -4px; flex: none; }
.pen { width: 30px; height: 44px; padding: 0; display: flex; align-items: flex-end; justify-content: center; }
.pen-i { display: block; height: 51px; width: 28px; transform: translateY(10px); transition: transform .15s ease; }
.pen-i svg { display: block; width: 28px; height: 51px; }
.pen[aria-pressed="true"] .pen-i { transform: translateY(0); }
.sws { flex: none; }
.eraser-ring { position: absolute; width: 0; height: 0; pointer-events: none; border: 1.5px solid var(--ink); border-radius: 50%; box-sizing: border-box; opacity: .6; display: none; transform: translate(-50%, -50%); }
.sws.off { opacity: .4; }
@media (prefers-reduced-motion: reduce) { .pen-i { transition: none; } }
@media (max-width: 385px) { .sw { width: 22px; height: 22px; } .sws::before { left: 11px; right: 11px; } .pen { width: 28px; } }
.pic { width: 100%; height: 100%; display: block; object-fit: contain; padding: 6%; box-sizing: border-box; pointer-events: none; -webkit-user-drag: none; user-select: none; }
.thumb .pic { padding: 4%; }
.seg button .ico { display: inline-flex; vertical-align: middle; }
.seg button.ico-only { padding: 0 9px; }
.photo-btn, .photo-empty { position: absolute; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: var(--ink); cursor: pointer; }
.photo-empty { color: var(--muted, var(--ink)); cursor: default; }
.photo-pick { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 28px; cursor: pointer; }
.photo-over { position: absolute; left: 50%; top: 100%; width: 220px; height: 44px; margin: 8px 0 0 -110px; opacity: 0; cursor: pointer; font-size: 16px; }
.photo-empty .ico { width: 64px; height: 64px; border: 1.5px dashed var(--ink); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.foot { display: flex; gap: 12px; margin-top: 16px; }

/* Editor de deck */
.name-input { width: 100%; min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); font: 700 22px/1 var(--f-display); letter-spacing: -.02em; margin-top: 8px; }
.name-input:focus { border-color: var(--ink); outline: none; }
.lib-search::-webkit-search-cancel-button, .lib-search::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.search-x { position: absolute; right: 4px; top: 50%; width: 44px; height: 44px; margin-top: -22px; display: flex; align-items: center; justify-content: center; color: var(--ink-2); border-radius: 50%; }
.search-x[hidden] { display: none; }
.search-x:active { color: var(--ink); }
.name-field { position: relative; margin-top: 8px; }
.name-field .name-input { margin-top: 0; padding-right: 104px; text-overflow: ellipsis; }
.name-actions { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: flex; }
.field-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); }
.field-btn:active { background: var(--line); }
.actions { display: flex; gap: 12px; margin: 16px 0 8px; }
.list { margin-top: 8px; border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 0; text-align: left; }
.row-n { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; color: var(--ink-2); width: 24px; flex: none; }
.thumb { width: 64px; aspect-ratio: 4 / 5; border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; flex: none; display: flex; }
.thumb .txt { padding: 0 4%; }
.row-del { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-2); border-radius: 50%; flex: none; }
.empty-list { padding: 24px 0; color: var(--ink-2); }
.code { width: 100%; min-height: 96px; margin-top: 10px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: 400 12px/1.4 var(--f-mono); resize: none; overflow: auto; word-break: break-all; }
.code:focus { border-color: var(--ink); outline: none; }
.tile-by { font: 400 12px/1.2 var(--f-body); color: var(--ink-2); margin-top: -4px; overflow-wrap: anywhere; }
.home-tools { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 0 16px; }
.tile-main { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.tile.pressing { transform: scale(.97); transition: transform .45s ease; }
.act-list { display: grid; gap: 12px; margin-top: 16px; }
.act { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 12px 16px; min-height: 56px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); width: 100%; }
.act-t { font: 700 17px/1.15 var(--f-display); letter-spacing: -.01em; }
.act-s { font: 400 13px/1.35 var(--f-body); color: var(--ink-2); }
.act.warn { border-color: var(--ink); }
.hid-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.hid-name { font: 700 16px/1.2 var(--f-display); min-width: 0; overflow-wrap: anywhere; }
.sec-gap { margin-top: 24px; }
.tile.lib { background: var(--panel); border: 1px solid var(--line); }
.tile.lib .tile-name { padding-right: 0; }
.lib-area { margin: 24px 0 8px; }
.search-box { position: relative; margin: 8px 0 16px; }
.lib-search { margin: 0; padding-right: 48px; min-height: 48px; font: 500 17px/1 var(--f-body); letter-spacing: 0; }
.lib-go { margin-left: auto; color: var(--ink-2); display: inline-flex; }
.lib-info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lib-name { font: 700 19px/1.1 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.lib-pairs { display: flex; justify-content: space-between; gap: 12px; margin: 16px 0 8px; }
.lib-pair { display: flex; align-items: center; gap: 4px; min-width: 0; }
.lib-pairs .thumb { width: 40px; border-radius: 6px; }
.lib-arrow { color: var(--ink-2); display: inline-flex; }
.lib-sub { margin: 8px 0 0; color: var(--ink-2); }
.danger-zone { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 4px 24px; }
.link-btn { min-height: 44px; font: 500 12px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); text-decoration: underline; text-underline-offset: 4px; }

/* Folha e aviso */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 480px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 24px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

  function viewStudy() {

      var rev = dir === 'rev' || (dir === 'mix' && Math.random() < 0.5);
      return { id: c.id, q: rev ? c.a : c.q, a: rev ? c.q : c.a, lv: rev ? c.lvr : c.lv, _src: c, _rev: rev };
    });
    function setLv(c, v) { c.lv = v; c._src[c._rev ? 'lvr' : 'lv'] = v; }

    }
    function rate(c, ok) {
      if (isVirtual(deck.id)) return;
      setLv(c, ok ? Math.min(2, (c.lv | 0) + 1) : 0);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { saveTimer = null; saveDeck(deck); }, 800);
    }
    if (mode === 'baralho') viewCleanup = flushLevels;
    /* Mesa: no máximo 15 cartas por vez; decks maiores viram "mesas" em sequência (1 a 15, 16 a 30, ...). */
    /* Mesa: até 20 cartas, todas na mesma tela (decks antigos maiores mostram as 20 primeiras). */
    function pageSeq() { return shuffleArr(natural.slice(0, MAX_CARDS)); }
    var seq = pageSeq();
    var shuffled = true;
    var order = mode === 'baralho' ? smartOrder() : seq;
    var pos = 0;
    /* Trocar o sentido no baralho mantém a sequência e a carta atual; só muda o lado que aparece na frente. */
    if (mode === 'baralho' && dirSession && dirSession.deckId === deck.id && dirSession.keep) {
      var kp = dirSession.keep; dirSession.keep = null;
      var idxOf = {}; cards.forEach(function (c, i) { idxOf[c.id] = i; });
      var ord = kp.order.map(function (id) { return idxOf[id]; }).filter(function (i) { return i != null; });

    }

    /* Ao encerrar no meio, as cartas sem resposta voltam ao começo do baralho (como as erradas). */

    function resume() {

    var counter = h('div', { class: 'label' });
    var sideBtn = mode === 'mesa' ? h('button', { class: 'led-toggle pill', onclick: function () {

    } }, 'Espalhar') : null;
    var body = h('div', { class: 'study-body' });

    /* Cartas alinhadas na mesa, sem inclinação. */
    var JIT = { rot: 0, dx: 0, dy: 0 };
    function paintTable() {
      var grid = h('div', { class: 'table' });
      var cells = [], cells_el = [];
      function syncAll() {}
      counter.textContent = n > MAX_CARDS ? MAX_CARDS + ' de ' + n + ' cartas' : n + (n === 1 ? ' carta' : ' cartas');
      seq.forEach(function (ci) {
        var c = cards[ci];
        var front = h('div', { class: 'face front' }); front.append(content(c.q, fg.q));
        var back = h('div', { class: 'face back' });

        var cell = h('button', { class: 'mini', 'aria-label': 'Carta da mesa. Toque para ver a resposta.' }, flip);
        /* Cada carta cai um pouco fora do lugar; a posição final em px é calculada no layoutGrid. */
        cell._j = { rot: (Math.random() * 2 - 1) * JIT.rot, dx: (Math.random() * 2 - 1) * JIT.dx, dy: (Math.random() * 2 - 1) * JIT.dy };

        ctl.set = function (v) {

        };

        var lpT = null, lx = 0, ly = 0;
        function lpStop() { clearTimeout(lpT); lpT = null; }
        cell.addEventListener('pointerdown', function (e) {
          if (e.button > 0) return;
          lx = e.clientX; ly = e.clientY; cell._lp = false; clearTimeout(lpT);
          lpT = setTimeout(function () { lpT = null; cell._lp = true; openZoom(c, ctl, cell); buzz(12); }, 450);
        });
        cell.addEventListener('pointermove', function (e) { if (lpT && Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly) > 10) lpStop(); });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { cell.addEventListener(ev, lpStop); });
        cell.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        cells.push(ctl);
        grid.append(cell);
      });
      body.append(grid);
      /* Todas as cartas cabem na tela, sempre do mesmo tamanho. */
      function layoutGrid() {
        var W = grid.clientWidth;
        if (!W) return;
        var top = grid.getBoundingClientRect().top + window.scrollY;
        var cs = getComputedStyle(document.documentElement), bs = getComputedStyle(document.body);
        var bottom = (parseFloat(cs.paddingBottom) || 0) + (parseFloat(bs.paddingBottom) || 0);

        for (var c = 1; c <= m; c++) {

        });
      }
      relayout = layoutGrid;
      layoutGrid();
      watch(grid, layoutGrid);
    }

    function paint() {

      if (mode === 'baralho') {

  /* ---------- compartilhar e importar ---------- */
  var AUTHOR_KEY = 'cartas-a-mao-autor';
  var CODE_PREFIX = 'CARTAS1.';
  function encodeDeck(deck) {
    var payload = { v: 1, name: deck.name, author: deck.author || '', cards: deck.cards.map(function (c) { return { q: c.q, a: c.a }; }) };
    return CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  }
  function cleanSideIn(side) {
    if (!side || typeof side !== 'object') return null;
    if (side.kind === 'text' && typeof side.text === 'string') return { kind: 'text', text: side.text.slice(0, 2000) };
    if (side.kind === 'image' && typeof side.src === 'string' && side.src.length <= 250000 && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(side.src)) {
      return { kind: 'image', src: side.src };
    }
    if (side.kind === 'draw' && Array.isArray(side.strokes) && side.strokes.length <= 400) {
      var out = [], total = 0;
      for (var i = 0; i < side.strokes.length; i++) {
        var st0 = side.strokes[i];
        var st = Array.isArray(st0) ? st0 : (st0 && typeof st0 === 'object' ? st0.p : null);
        if (!Array.isArray(st) || st.length < 2 || st.length > 20000) return null;
        var row = [];
        for (var j = 0; j < st.length; j++) {
          var v = Number(st[j]);
          if (!isFinite(v)) return null;
          row.push(Math.max(0, Math.min(1250, Math.round(v))));
        }
        total += row.length;
        if (total > 300000) return null;
        var ck = 'k', wk = 2;
        if (!Array.isArray(st0)) {
          ck = COLORS.some(function (c) { return c.k === st0.c; }) ? st0.c : 'k';
          wk = st0.w === 1 || st0.w === 3 || st0.w === 4 ? st0.w : 2;
        }
        out.push(ck === 'k' && wk === 2 ? row : { p: row, c: ck, w: wk });
      }
      return { kind: 'draw', strokes: out };
    }
    return null;
  }
  function decodeDeck(code, keepAll) {
    try {
      var t = String(code || '').trim(), obj;
      if (t.charAt(0) === '{') obj = JSON.parse(t);
      else {
        t = t.replace(/\s+/g, '');
        if (t.indexOf(CODE_PREFIX) !== 0) return null;
        obj = JSON.parse(decodeURIComponent(escape(atob(t.slice(CODE_PREFIX.length)))));
      }
      if (!obj || obj.v !== 1 || typeof obj.name !== 'string' || !Array.isArray(obj.cards) || obj.cards.length > 500) return null;
      var cards = [];
      for (var i = 0; i < obj.cards.length; i++) {
        var q = cleanSideIn(obj.cards[i] && obj.cards[i].q), a = cleanSideIn(obj.cards[i] && obj.cards[i].a);
        if (!q || !a) return null;
        cards.push({ id: uid(), q: q, a: a });
      }
      var cut = !keepAll && cards.length > MAX_CARDS;
      if (cut) cards = cards.slice(0, MAX_CARDS);
      var dk = { id: uid(), name: obj.name.slice(0, 40) || 'Deck importado', author: typeof obj.author === 'string' ? obj.author.slice(0, 40) : '', createdAt: Date.now(), updatedAt: Date.now(), cards: cards };
      if (typeof obj.desc === 'string' && obj.desc.trim()) dk.desc = obj.desc.trim().slice(0, 80);
      if (typeof obj.area === 'string' && obj.area.trim()) dk.area = obj.area.trim().slice(0, 30);
      if (cut) dk._cut = true;
      return dk;
    } catch (e) { return null; }
  }

  function deckFileName(deck) {
    var n = String(deck.name || 'Deck').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() || 'Deck';
    return n + '.cartas.json';
  }
  /* Entrega o deck como arquivo: folha de compartilhar do iPhone (WhatsApp, Arquivos...) quando disponível. */
  function sendDeckFile(deck) {
    sendFile(deckFileName(deck), JSON.stringify({ v: 1, name: deck.name, desc: deck.desc || '', area: deck.area || '', author: deck.author || '', cards: deck.cards.map(function (c) { return { q: c.q, a: c.a }; }) }), deck.name);
  }
  function sendFile(name, text, title) {
    function viaAnchor() {
      try {
        var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      } catch (e) { toast('Não consegui gerar o arquivo.'); }
    }
    function viaShare() {
      try {
        var f = new File([text], name, { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [f] })) {
          navigator.share({ files: [f], title: title }).catch(function (e) { if (!e || e.name !== 'AbortError') viaAnchor(); });
          return;
        }
      } catch (e) {}
      viaAnchor();
    }
    var useP = (window.claude && window.claude.use) ? window.claude.use('downloads') : Promise.resolve(null);
    useP.then(function (dl) {
      if (!dl) { viaShare(); return; }
      return dl.save({ filename: name, data: text }).catch(function (e) {
        if (e && e.code === 'declined') return;
        if (e && (e.code === 'bad_request' || e.code === 'too_large')) { toast('Não consegui gerar o arquivo.'); return; }
        viaShare();
      });
    }, viaShare);
  }

  function shareSheet(deck) {
    var input = h('input', { class: 'name-input', id: 'author-name', type: 'text', maxlength: '40', autocapitalize: 'words', 'aria-label': 'Seu nome, como autor do deck', placeholder: 'Seu nome (assinatura do deck)', value: deck.author || lsGet(AUTHOR_KEY) || '' });
    function build() {

    }
    var send = h('button', { class: 'btn wide primary', id: 'send-file', onclick: function () { build(); sendDeckFile(deck); } }, 'Enviar deck');
    var code = encodeDeck(deck);
    var small = code.length < 6000;
    openSheet(h('div', null,
      h('div', { class: 'label' }, deck.name),
      h('h2', { class: 'sheet-title', style: 'margin-top:8px' }, 'Compartilhar deck'),
      input,
      h('p', { class: 'hint' }, 'Toque em Enviar deck e escolha o WhatsApp ou outro app. Quem receber salva o arquivo e, aqui no app, abre Coleção, Restaurar backup e Escolher arquivo.'),
      h('div', { class: 'sheet-actions' }, h('button', { class: 'btn wide', onclick: closeSheet }, 'Fechar'), send),
      small ? h('button', { class: 'link-btn', id: 'copy-code', style: 'margin-top:8px', onclick: function () {
        build();

      } }, 'Ou copiar como código') : ''
    ));
  }
  function importSheet() {
    var msg = h('p', { class: 'hint', id: 'import-msg', 'aria-live': 'polite' }, '');
    var fileIn = h('input', { type: 'file', style: 'display:none', id: 'import-file', 'aria-hidden': 'true', tabindex: '-1' });
    var area = h('textarea', { class: 'code', id: 'import-code', rows: '3', 'aria-label': 'Código do deck', spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', placeholder: 'Ou cole um código aqui' });
    function finish(raw) {
      if (/"kind"\s*:\s*"backup"/.test(raw.slice(0, 400))) {
        var k = restoreBackup(raw);
        if (k < 0) { msg.textContent = 'Não consegui ler esse backup.'; return; }
        closeSheet(); state = { view: 'home' }; render();
        toast(k + (k === 1 ? ' deck restaurado' : ' decks restaurados'));
        return;
      }
      var deck = decodeDeck(raw);
      if (!deck) { msg.textContent = 'Não consegui ler esse deck. Confira se é um arquivo ou código do Cartas à Mão.'; return; }
      deck.name = uniqueName(deck.name);
      var wasCut = !!deck._cut; delete deck._cut;
      closeSheet();
      saveDeck(deck);
      state = { view: 'home' }; render();
      toast(wasCut ? 'Deck importado, só as ' + MAX_CARDS + ' primeiras cartas' : 'Deck importado');
    }
    function run() {
      var raw = area.value.trim();
      if (!raw) { msg.textContent = 'Escolha um arquivo ou cole um código.'; return; }
      finish(raw);
    }
    fileIn.addEventListener('change', function () {
      var f = fileIn.files && fileIn.files[0];
      fileIn.value = '';
      if (!f) return;
      if (f.size > 12 * 1024 * 1024) { msg.textContent = 'Esse arquivo é grande demais para ser um deck.'; return; }
      var r = new FileReader();
      r.onload = function () { finish(String(r.result || '')); };
      r.onerror = function () { msg.textContent = 'Não consegui abrir esse arquivo.'; };
      r.readAsText(f);
    });
    area.addEventListener('paste', function () { setTimeout(run, 50); });
    openSheet(h('div', null,
      h('div', { class: 'label' }, 'Importar deck'),
      h('h2', { class: 'sheet-title', style: 'margin-top:8px' }, 'Escolher arquivo'),
      h('p', { class: 'hint', style: 'margin-top:8px' }, 'Abra o arquivo que você recebeu, do WhatsApp ou de Arquivos.'),
      h('button', { class: 'btn wide primary', id: 'pick-file', style: 'width:100%;margin-top:16px', onclick: function () { fileIn.click(); } }, 'Escolher arquivo'),
      fileIn,
      area,
      msg,
      h('div', { class: 'sheet-actions' }, h('button', { class: 'btn wide', onclick: closeSheet }, 'Cancelar'), h('button', { class: 'btn wide', onclick: run }, 'Importar código'))
    ));
  }

  /* ---------- nomes aleatórios ---------- */

          try { c.setPointerCapture(e.pointerId); } catch (err) {}
          var p = pt(e);
          if (brush.eraser) { erasing = { snap: s.strokes.slice(), changed: false, last: p }; showRing(e); eraseAt(p); return; }
          cur = { p: [p[0], p[1]], c: brush.c, w: brush.w }; s.strokes.push(cur); (s.hist = s.hist || []).push('a');

            return;
          }
          if (!cur) return;
          var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
          if (!evs.length) evs = [e];
          evs.forEach(function (ev) {
            var p = pt(ev);
            var cp = cur.p, dx = p[0] - cp[cp.length - 2], dy = p[1] - cp[cp.length - 1];

        };

        c.addEventListener('pointercancel', end);

      } else if (s.kind === 'image') {
        if (s.src) {
          paper.append(h('button', { class: 'photo-btn', 'aria-label': 'Trocar a foto', onclick: pickPhoto },
            h('img', { class: 'pic', src: s.src, alt: 'Foto da carta', draggable: 'false' })));
        } else {
          /* O campo de arquivo é o próprio alvo do toque, então o menu do sistema abre sempre aqui, ancorado no ícone. */
          var over = h('input', { type: 'file', accept: 'image/*', class: 'photo-over', 'aria-label': 'Escolher uma foto' });

          var tapPick = function () { over.click(); };
          over.addEventListener('change', function () { onPhoto(over); });
          over.addEventListener('cancel', function () { setPending(false); });

            h('div', { class: 'photo-pick', onclick: function (e) { if (e.target !== over) tapPick(); } }, icon('image', 30), h('span', { class: 'label' }, 'Escolher foto'), over)));
        }
      } else {
        var ta = h('textarea', { class: 'type', id: 'type-' + step, spellcheck: 'false', autocapitalize: 'sentences', autocomplete: 'off', 'aria-label': step === 'q' ? 'Texto da pergunta' : 'Texto da resposta' });
        ta.value = s.text;
        ta.addEventListener('focus', function () { if (pickGuard()) ta.blur(); });
        var fit = function () {
          var fs;
          if (!ta.value) {

    }

    var PENS = [
      { id: 'pen', name: 'Caneta', w: 2, body: 'M7 24h10v18H7z' },
      { id: 'fine', name: 'Caneta fina', w: 1, body: 'M9 28h6v14H9z' },
      { id: 'marker', name: 'Marcador', w: 4, body: 'M6 20h12v22H6z' },
      { id: 'eraser', name: 'Borracha', w: 0, body: 'M6 22h12v20H6z' }

    function penSvg(t) {
      var k = t.id, col = colorOf(brush.c);
      var tip = k === 'pen' ? '<path d="M8.5 24L12 8l3.5 16z" fill="' + col + '"/>'
        : k === 'fine' ? '<path d="M10 28L12 12l2 16z" fill="' + col + '"/><path d="M11.4 16h1.2v-5h-1.2z" fill="' + col + '"/>'
        : k === 'marker' ? '<path d="M7 20l1.5-9h7L17 20z" fill="' + col + '" fill-opacity=".55"/>'
        : '<rect x="6" y="10" width="12" height="12" rx="3" fill="var(--line)"/>';
      var ring = k === 'eraser' ? '' : '<rect x="' + (k === 'fine' ? 9 : k === 'marker' ? 6 : 7) + '" y="' + (k === 'fine' ? 34 : 30) + '" width="' + (k === 'fine' ? 6 : k === 'marker' ? 12 : 10) + '" height="3" fill="var(--ink)" opacity=".85"/>';
      return '<svg viewBox="0 0 24 44" width="24" height="44" aria-hidden="true">' + tip +
        '<path d="' + t.body + '" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>' + ring + '</svg>';
    }
    function paletteEl() {
      var sws = h('div', { class: 'sws', role: 'group', 'aria-label': 'Cor' });
      var pens = h('div', { class: 'pens', role: 'group', 'aria-label': 'Ferramenta' });
      function sync() {
        [].forEach.call(sws.children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === brush.c)); });
        sws.classList.toggle('off', brush.eraser);
        [].forEach.call(pens.children, function (b) {
          var on = brush.eraser ? b.dataset.id === 'eraser' : b.dataset.w === String(brush.w);
          b.setAttribute('aria-pressed', String(on));
          if (b.dataset.id !== 'eraser') b.firstChild.innerHTML = penSvg(PENS[+b.dataset.n]);
        });
      }
      COLORS.forEach(function (c) {
        var b = h('button', { class: 'sw', 'aria-label': c.name, 'aria-pressed': 'false', onclick: function () { brush.c = c.k; if (brush.eraser) { brush.eraser = false; brush.w = 2; } sync(); } });
        b.dataset.k = c.k; b.style.background = c.hex || 'var(--ink)';
        sws.append(b);
      });
      PENS.forEach(function (t, n) {
        var ico = h('span', { class: 'pen-i' });
        var b = h('button', { class: 'pen', 'aria-label': t.name, 'aria-pressed': 'false', onclick: function () {
          if (t.id === 'eraser') brush.eraser = true; else { brush.eraser = false; brush.w = t.w; }
          sync();
        } }, ico);
        b.dataset.id = t.id; b.dataset.w = String(t.w); b.dataset.n = String(n);
        ico.innerHTML = penSvg(t);
        pens.append(b);
      });
      sync();
      return h('div', { class: 'palette' }, pens, sws);
    }

    function setKind(k) {
      var cur = sideNow();
      if (k === 'image') {
        /* Imagem é um modo de verdade: continua ativo até tocar em Digitar ou Desenhar. */
        if (cur.kind !== 'image') { cur.kind = 'image'; draw(); }
        if (!cur.src) { var o = box.querySelector('.photo-over'); if (o) o.click(); }
        return;
      }
      pending = false; clearTimeout(pendTimer);
      if (cur.kind === k) { markSeg(); return; }
      cur.kind = k; lastKind = k;
      var other = step === 'q' ? draft.a : draft.q;
      if (!hasContent(other) && other.kind !== 'image') other.kind = k;
      draw();
      if (k === 'text') { var t = box.querySelector('textarea'); if (t) t.focus({ preventScroll: true }); }
    }

    function draw(focusText) {
      clearWatch(); box.replaceChildren();
      var s = sideNow();
      segBtns = {
        text: h('button', { 'aria-pressed': String(!pending && s.kind === 'text'), onclick: function () { setKind('text'); } }, 'Digitar'),
        draw: h('button', { 'aria-pressed': String(!pending && s.kind === 'draw'), onclick: function () { setKind('draw'); } }, 'Desenhar'),
        image: h('button', { 'aria-pressed': String(pending || s.kind === 'image'), onclick: function () { setKind('image'); } }, 'Imagem')
      };
      var seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Modo de entrada' }, segBtns.text, segBtns.draw, segBtns.image);
      undoBtn = h('button', { class: 'tool icon', 'aria-label': 'Desfazer', onclick: function () {
        var hst = s.hist && s.hist.pop();
        if (hst && hst.snap) s.strokes = hst.snap;
        else s.strokes.pop();
        draw();
      } }, icon('undo', 18));
      clearBtn = h('button', { class: 'tool icon', 'aria-label': 'Limpar', onclick: function () {
        if (s.kind === 'draw') s.strokes = []; else if (s.kind === 'image') s.src = ''; else s.text = '';
        draw();
      } }, icon('trash', 18));
      nextBtn = null; saveBtn = null;
      var go1;
      if (step === 'q') {
        nextBtn = h('button', { class: 'tool primary', 'aria-label': 'Avançar para a resposta', onclick: function () { step = 'a'; draw(true); window.scrollTo(0, 0); } }, 'Avançar');
        go1 = nextBtn;
      } else {
        saveBtn = h('button', { class: 'tool primary', 'aria-label': existing ? 'Salvar alterações' : (deck.cards.length + 1 >= MAX_CARDS ? 'Salvar a última carta' : 'Salvar e abrir a próxima carta'), onclick: save }, existing || deck.cards.length + 1 >= MAX_CARDS ? 'Salvar' : 'Próxima');
        go1 = saveBtn;
      }
      var tools = h('div', { class: 'tools' }, seg, h('div', { class: 'tool-btns' }, s.kind === 'draw' ? undoBtn : null, clearBtn, go1));
      box.append(
        h('div', { class: 'steps', role: 'tablist' }, pill('q', 1, 'Pergunta'), pill('a', 2, 'Resposta')),
        h('div', { class: 'stage edit' }, stageEl()),
        tools

      app.style.setProperty('--reserve', 'calc(' + 240 + 'px + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px))');

    }

      var data = { id: existing ? existing.id : uid(), q: cleanSide(draft.q), a: cleanSide(draft.a) };
      if (existing) {
        d.cards = d.cards.map(function (c) { return c.id === existing.id ? data : c; });
      } else {
        d.cards.push(data);
      }
      saveDeck(d);
      return d;
    }

    function save() {
      var d = commit();
      if (!d) return;
      if (existing) go('deck', { deckId: d.id });
      else if (d.cards.length >= MAX_CARDS) { go('deck', { deckId: d.id }); toast('Deck completo: ' + MAX_CARDS + ' cartas.'); }
      else go('edit', { deckId: d.id, cardId: null });
    }

    function leave() {
      if (hasContent(draft.q) && hasContent(draft.a)) {
        commit();
      }
      go('deck', { deckId: deck.id });
    }

    window.scrollTo(0, 0);
    draw(!existing);
    if (vvShrunk()) { kb = true; layoutStage(false); pinTop(); }
  }

  var LIBRARY = [];
  function libFinish(arr) {
    LIBRARY = arr;
    LIBRARY.forEach(function (it) { if (it.t) { it.cards = it.t.map(function (p) { return { q: { kind: 'text', text: p[0] }, a: { kind: 'text', text: p[1] } }; }); delete it.t; } });
    libLoaded = true; libFailed = false;
    if (state.view === 'library') render();
  }
  function loadLibrary() {
    fetch('biblioteca.json').then(function (r) { if (!r.ok) throw new Error('lib'); return r.json(); }).then(libFinish)
      .catch(function () { libFailed = true; if (state.view === 'library') render(); });
  }
  libLoaded = false;
  loadLibrary();

  /* ---------- início ---------- */
  var origGo = go;
  go = function (view, params) { app.style.removeProperty('--reserve'); origGo(view, params); };

  try {
    var raw = lsGet(KEY);
    if (raw) {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) decks = arr.filter(function (d) { return d && d.id && Array.isArray(d.cards); });
    }
  } catch (e) {}
  hideExample = lsGet(HIDE_KEY) === '1';
  (function () {
    var vv = window.visualViewport;
    function setVH() { document.documentElement.style.setProperty('--vh', (vv ? vv.height : window.innerHeight) + 'px'); }
    setVH();
    if (vv) vv.addEventListener('resize', setVH);

  })();
  applyTheme(themePref());
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(repaintAll); } catch (e) {}
  go('home');
  initStore();
  (function () {
    var off = false;
    off = !!window.__NOSPLASH;
    if (off) { splashEl.remove(); return; }
    document.getElementById('splash-icon').innerHTML = appIcon(112);
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    setTimeout(function () { splashEl.classList.add('out'); setTimeout(function () { splashEl.remove(); }, reduce ? 0 : 320); }, reduce ? 500 : 1250);
  })();
})();
