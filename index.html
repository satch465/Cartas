<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>Cartas à Mão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma coluna estreita, como a face de um aparelho. Decks em blocos (bento) com leds de contagem, botões redondos como teclas, laranja só na ação principal. */
:root {
  --bg: #D5D0BF;
  --panel: #E3DECD;
  --card: #EEE9D8;
  --ink: #23211C;
  --ink-2: #54503F;
  --line: #B9B29E;
  --accent: #DC5019;
  --accent-ink: #23211C;
  --shade: rgba(70,60,40,.40); --glow: rgba(255,255,255,.80);
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161715; --panel: #22231F; --card: #2B2C28; --ink: #ECECE6; --ink-2: #A3A59D;
    --line: #3C3E38; --accent: #FF6B2C; --accent-ink: #161715; --shade: rgba(0,0,0,.60); --glow: rgba(255,255,255,.07); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161715; --panel: #22231F; --card: #2B2C28; --ink: #ECECE6; --ink-2: #A3A59D;
  --line: #3C3E38; --accent: #FF6B2C; --accent-ink: #161715; --shade: rgba(0,0,0,.60); --glow: rgba(255,255,255,.07); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.4 var(--f-body);
  padding-block: 8px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; min-width: 0; }
.ico { display: inline-grid; place-items: center; }
.label { font: 500 11px/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }

/* Home */
.masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 0 16px; flex-wrap: wrap; }
.masthead .status { flex: 0 0 100%; padding-bottom: 0; }
.brand { font: 800 34px/1 var(--f-display); letter-spacing: -.03em; margin: 8px 0 0; text-wrap: balance; }
.label.pos { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink); }
.mast-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.status { display: flex; align-items: center; gap: 8px; font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); padding-bottom: 4px; }
.led { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-2); flex: none; }
.led.on { background: var(--accent); border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; min-height: 156px; min-width: 0; }
.tile-main { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 12px; width: 100%; height: 100%; min-height: 156px; padding: 16px; text-align: left; border-radius: 16px; }
.tile-name { font: 700 21px/1.08 var(--f-display); letter-spacing: -.02em; padding-right: 30px; overflow-wrap: anywhere; text-wrap: balance; }
.tile-foot { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.tile-meta { font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.dots i.off { background: transparent; border: 1px solid var(--ink-2); }
.tile-edit { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); }
.tile-top { display: flex; flex-direction: column; gap: 4px; min-width: 0; width: 100%; }
.tile-desc { font: 400 12.5px/1.3 var(--f-body); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile.compact, .tile.compact .tile-main { min-height: 118px; }
.tile.compact .tile-main { padding: 12px; gap: 8px; }
.tile.compact .tile-name { font-size: 17px; padding-right: 0; }
.tile.compact .tile-foot { gap: 8px; }
.grp { grid-column: 1 / -1; margin: 12px 0 0; }
.grp:first-child { margin-top: 0; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 0 16px; margin: 0 0 12px; }
.ctl-row .led-toggle b { font-weight: 500; color: var(--ink); border-bottom: 1px dotted var(--ink-2); }
.act.sel { border-color: var(--ink); background: var(--panel); }
.field-gap { margin-top: 8px; }
.tile.new { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tile.new .tile-main { justify-content: space-between; }
.tile.new .tile-name { padding-right: 0; }
.note { font: 400 12px/1.5 var(--f-mono); color: var(--ink-2); margin: 16px 0 0; max-width: 40ch; }

/* Barras e botões */
.bar { display: flex; align-items: center; gap: 12px; padding-block: 8px; }
.bar .grow { flex: 1; min-width: 0; }
.title-btn { display:flex; align-items:center; gap:6px; max-width:100%; margin-top:4px; padding:0; border:0; background:none; color:inherit; font:700 20px/1.15 var(--f-display); letter-spacing:-.02em; text-align:left; cursor:pointer; }
.title-btn .bar-title-txt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.title-btn svg { flex:none; opacity:.45; }
.bar-title { font: 700 20px/1.15 var(--f-display); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.round { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--panel); display: grid; place-items: center; flex: none; }
.round:disabled { opacity: .35; }
.round:active:not(:disabled) { transform: scale(.96); }
.btn { min-height: 52px; padding: 0 22px; border-radius: 26px; border: 1.5px solid var(--ink); background: var(--panel); font: 600 16px/1 var(--f-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .38; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.wide { flex: 1; }
.led-toggle { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 4px; font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }

/* Cartas */
.stage { position: relative; width: min(100%, max(240px, calc((100dvh - var(--reserve, 270px)) * .8))); aspect-ratio: 4 / 5; margin: 8px auto 0; max-width: 100%; }
.stage.study { perspective: 1400px; cursor: pointer; margin-top: 16px; }
.flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3, .7, .2, 1); }
.flip.is-flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; }
.face.back { transform: rotateY(180deg); }
.face-label { position: absolute; top: 14px; left: 16px; font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); z-index: 1; }
.face canvas, .thumb canvas, .paper canvas { width: 100%; height: 100%; display: block; }
.txt { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; white-space: pre-wrap; overflow: hidden; padding: 0 7%; font: 800 40px/1.18 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 24px; }
.controls .btn { min-width: 150px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.panel h2 { font: 800 26px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.panel p { margin: 0; color: var(--ink-2); max-width: 36ch; }
.panel .row-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 0; }
.panel .res-actions { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.res-actions .btn { padding: 0 10px; font-size: 15px; line-height: 1.15; text-align: center; min-width: 0; }
.res-actions .btn.primary { grid-column: 1 / -1; }

/* Editor de carta */
.steps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 12px; }
.step { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid var(--line); font: 500 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.step .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid currentColor; font-size: 11px; }
.step[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.paper { position: relative; width: 100%; height: 100%; background-color: var(--card); background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 24px 24px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.paper canvas { touch-action: none; -webkit-user-select: none; user-select: none; cursor: crosshair; }
.type { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; resize: none; overflow: hidden; text-align: center; padding: 0 7%; font: 800 40px/1.18 var(--f-display); letter-spacing: -.02em; color: var(--ink); caret-color: var(--accent); outline: none; }
.type::placeholder { color: var(--ink-2); font-family: var(--f-body); font-weight: 500; font-size: inherit; line-height: inherit; letter-spacing: 0; }
.app.kb .bar { padding-block: 0 2px; }
.app.kb .bar .round { width: 40px; height: 40px; }
.app.kb .steps { margin: 4px 0 8px; }
.app.kb .stage.edit { margin-top: 0; }
.app.kb .tools { margin-top: 8px; }
.stage.edit { transition: height .2s ease; }
.stage.edit { width: min(100%, max(110px, calc((var(--vh, 100dvh) - var(--reserve, 330px)) * .8))); }
.tool.icon { width: 38px; padding: 0; justify-content: center; }
.tool.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 22px; overflow: hidden; }
.seg button { min-height: 40px; padding: 0 10px; font: 500 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tool-btns { display: flex; gap: 8px; }
.tool { min-height: 40px; padding: 0 10px; border-radius: 20px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.tool:disabled { opacity: .35; }
.palette { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px auto 0; max-width: 100%; width: min(100%, max(110px, calc((var(--vh, 100dvh) - var(--reserve, 330px)) * .8))); }
.sws, .wds { display: flex; align-items: center; gap: 4px; }
.sw, .wd { width: 24px; height: 24px; border-radius: 50%; flex: none; border: 1.5px solid var(--line); padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }
.palette { padding: 0 2px; box-sizing: border-box; }
.wd { color: var(--ink); }
.wd i { display: block; border-radius: 50%; background: currentColor; }
.wd[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
@media (max-width: 385px) { .sw, .wd { width: 23px; height: 23px; } .sws, .wds { gap: 3px; } .palette { gap: 6px; } }
.pic { width: 100%; height: 100%; display: block; object-fit: contain; padding: 6%; box-sizing: border-box; pointer-events: none; -webkit-user-drag: none; user-select: none; }
.thumb .pic { padding: 4%; }
.seg button .ico { display: inline-flex; vertical-align: middle; }
.seg button.ico-only { padding: 0 9px; }
.photo-btn, .photo-empty { position: absolute; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: var(--ink); cursor: pointer; }
.photo-empty { color: var(--muted, var(--ink)); }
.photo-empty .ico { width: 64px; height: 64px; border: 1.5px dashed var(--ink); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.foot { display: flex; gap: 12px; margin-top: 16px; }

/* Editor de deck */
.name-input { width: 100%; min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); font: 700 22px/1 var(--f-display); letter-spacing: -.02em; margin-top: 8px; }
.name-input:focus { border-color: var(--ink); outline: none; }
.name-field { position: relative; margin-top: 8px; }
.name-field .name-input { margin-top: 0; padding-right: 104px; text-overflow: ellipsis; }
.name-actions { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: flex; }
.field-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); }
.field-btn:active { background: var(--line); }
.actions { display: flex; gap: 12px; margin: 16px 0 8px; }
.list { margin-top: 8px; border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 0; text-align: left; }
.row-n { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; color: var(--ink-2); width: 24px; flex: none; }
.thumb { width: 64px; aspect-ratio: 4 / 5; border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; flex: none; display: flex; }
.thumb .txt { padding: 0 4%; }
.row-del { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-2); border-radius: 50%; flex: none; }
.empty-list { padding: 24px 0; color: var(--ink-2); }
.code { width: 100%; min-height: 96px; margin-top: 10px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: 400 12px/1.4 var(--f-mono); resize: none; overflow: auto; word-break: break-all; }
.code:focus { border-color: var(--ink); outline: none; }
.tile-by { font: 400 12px/1.2 var(--f-body); color: var(--ink-2); margin-top: -4px; overflow-wrap: anywhere; }
.home-tools { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 0 16px; }
.tile-main { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.tile.pressing { transform: scale(.97); transition: transform .45s ease; }
.act-list { display: grid; gap: 12px; margin-top: 16px; }
.act { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 12px 16px; min-height: 56px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); width: 100%; }
.act-t { font: 700 17px/1.15 var(--f-display); letter-spacing: -.01em; }
.act-s { font: 400 13px/1.35 var(--f-body); color: var(--ink-2); }
.act.warn { border-color: var(--ink); }
.hid-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.hid-name { font: 700 16px/1.2 var(--f-display); min-width: 0; overflow-wrap: anywhere; }
.sec-gap { margin-top: 24px; }
.tile.lib { background: var(--panel); border: 1.5px solid var(--ink); }
.tile.lib .tile-name { padding-right: 0; }
.lib-area { margin: 24px 0 8px; }
.lib-search { margin: 8px 0 16px; padding-right: 16px; min-height: 48px; font: 500 17px/1 var(--f-body); letter-spacing: 0; }
.lib-go { margin-left: auto; color: var(--ink-2); display: inline-flex; }
.lib-info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lib-name { font: 700 19px/1.1 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.lib-pairs { display: flex; justify-content: space-between; gap: 12px; margin: 16px 0 8px; }
.lib-pair { display: flex; align-items: center; gap: 4px; min-width: 0; }
.lib-pairs .thumb { width: 40px; border-radius: 6px; }
.lib-arrow { color: var(--ink-2); display: inline-flex; }
.lib-sub { margin: 8px 0 0; color: var(--ink-2); }
.danger-zone { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 4px 24px; }
.link-btn { min-height: 44px; font: 500 12px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); text-decoration: underline; text-underline-offset: 4px; }

/* Folha e aviso */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 480px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 24px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.sheet { max-height: calc(var(--vh, 100dvh) - 24px); overflow-y: auto; overscroll-behavior: contain; }
.act-list.long { max-height: calc(var(--vh, 100dvh) - 270px); overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
.sheet-title { font: 800 22px/1.15 var(--f-display); letter-spacing: -.02em; margin: 0 0 16px; text-wrap: balance; overflow-wrap: anywhere; }
.sheet-actions { display: flex; gap: 12px; margin-top: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 22px; font: 500 12px/1.3 var(--f-mono); letter-spacing: .06em; max-width: calc(100% - 32px); text-align: center; }

.table { display: grid; justify-content: center; }
.mini { position: relative; width: 100%; aspect-ratio: 4 / 5; padding: 0; perspective: 900px; border-radius: 14px; }
.mini .face { border-radius: 14px; }
.mini { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
/* Ampliar uma carta da mesa: segurar abre, tocar fecha. O fundo continua visível. */
.zoom { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: rgba(35, 33, 28, .32); cursor: pointer; animation: fadeIn .15s ease-out; transition: opacity .15s ease; }
.zoom.out { opacity: 0; }
.zoom:focus { outline: none; }
.zoomcard { position: relative; width: min(76vw, calc((var(--vh, 100dvh) - 240px) * .8), 400px); aspect-ratio: 4 / 5; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; box-shadow: 0 18px 44px rgba(0, 0, 0, .35); animation: zoomIn .2s cubic-bezier(.2, .8, .2, 1); }
@keyframes zoomIn { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .zoom, .zoomcard { animation: none; transition: none; } }
.badge { position: absolute; top: 8px; right: 8px; z-index: 2; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 500 12px/1 var(--f-mono); }
.opts { display: grid; gap: 12px; }
.opt { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; text-align: left; padding: 16px; min-height: 84px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); }
.opt.on { border-color: var(--accent); }
.opt-title { font: 800 21px/1.1 var(--f-display); letter-spacing: -.02em; }
.opt-text { color: var(--ink-2); font-size: 14px; }
.hint { font: 400 13px/1.5 var(--f-body); color: var(--ink-2); margin: 12px 0 0; max-width: 44ch; }

.cell { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.g-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.g-btn { min-height: 40px; border-radius: 20px; border: 1.5px solid var(--line); font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
.g-btn:disabled { opacity: .35; }

    if (!deck || !deck.cards.length) { go('study', { deckId: deckId, mode: 'baralho' }); return; }
    function opt(mode, title, text) {
      return h('button', { class: 'opt', onclick: function () {
        closeSheet(); go('study', { deckId: deckId, mode: mode });
      } },
        h('span', { class: 'opt-title' }, title),
        h('span', { class: 'opt-text' }, text));
    }
    openSheet(h('div', null,
      h('div', { class: 'label' }, deck.name),
      h('h2', { class: 'sheet-title', style: 'margin-top:8px' }, 'Como estudar?'),
      h('div', { class: 'opts' },
        opt('mesa', 'Mesa', 'Cartas espalhadas. Toque numa para virar e ver a resposta.'),
        opt('baralho', 'Baralho', 'Embaralhadas, uma de cada vez.')),
      h('div', { class: 'sheet-actions' }, h('button', { class: 'btn wide', onclick: closeSheet }, 'Cancelar'))
    ));
  }

  /* Uma carta grande que vira ao toque. */
  function cardBlock(c, onFlip) {
    var flipped = false;
    var front = faceEl(c.q, 'Pergunta', 'front');
    var back = faceEl(c.a, 'Resposta', 'back');
    var flip = h('div', { class: 'flip' }, front, back);
    var flipBtn = h('button', { class: 'btn primary' }, 'Ver resposta');
    function sync() {
      flip.classList.toggle('is-flipped', flipped);
      front.setAttribute('aria-hidden', String(flipped));
      back.setAttribute('aria-hidden', String(!flipped));
      flipBtn.textContent = flipped ? 'Ver pergunta' : 'Ver resposta';
    }
    function toggle() { flipped = !flipped; sync(); if (onFlip) onFlip(flipped); }
    flipBtn.addEventListener('click', toggle);
    var stage = h('div', { class: 'stage study', role: 'button', tabindex: '0', 'aria-label': 'Virar a carta', onclick: toggle }, flip);
    stage.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    sync();
    return { stage: stage, flipBtn: flipBtn };
  }

  function viewStudy() {
    var deck = getDeck(state.deckId);
    if (!deck) { go('home'); return; }
    var mode = state.mode === 'mesa' ? 'mesa' : 'baralho';
    var review = Array.isArray(state.only);
    var dir = (dirSession && dirSession.deckId === deck.id) ? dirSession.dir : 'normal';
    /* O sentido troca o que aparece na frente. Cada direção guarda o seu próprio nível (lv e lvr). */
    var cards = deck.cards.filter(function (c) { return !review || state.only.indexOf(c.id) >= 0; }).map(function (c) {
      var rev = dir === 'rev' || (dir === 'mix' && Math.random() < 0.5);
      return { id: c.id, q: rev ? c.a : c.q, a: rev ? c.q : c.a, lv: rev ? c.lvr : c.lv, _src: c, _rev: rev };
    });
    function setLv(c, v) { c.lv = v; c._src[c._rev ? 'lvr' : 'lv'] = v; }
    var n = cards.length;
    var natural = cards.map(function (_, i) { return i; });
    var results = {};
    /* Memória do baralho: cartas erradas vêm primeiro, as já sabidas ficam para o fim. */
    function smartOrder() {
      var groups = [[], [], []];
      natural.forEach(function (i) { groups[Math.min(2, Math.max(0, cards[i].lv | 0))].push(i); });
      return [].concat(shuffleArr(groups[0]), shuffleArr(groups[1]), shuffleArr(groups[2]));
    }
    var saveTimer = null;
    function flushLevels() {
      if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; if (!isVirtual(deck.id)) saveDeck(deck); }
    }
    function rate(c, ok) {
      if (isVirtual(deck.id)) return;
      setLv(c, ok ? Math.min(2, (c.lv | 0) + 1) : 0);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { saveTimer = null; saveDeck(deck); }, 800);
    }
    if (mode === 'baralho') viewCleanup = flushLevels;
    /* Mesa: no máximo 15 cartas por vez; decks maiores viram "mesas" em sequência (1 a 15, 16 a 30, ...). */
    var MESA_MAX = 15, mesaPage = 0, mesaPages = Math.max(1, Math.ceil(n / MESA_MAX));
    function pageSeq() { return shuffleArr(natural.slice(mesaPage * MESA_MAX, (mesaPage + 1) * MESA_MAX)); }
    var seq = pageSeq();
    var shuffled = true;
    var order = mode === 'baralho' ? smartOrder() : seq;
    var pos = 0;
    var ended = false, prevLv = {};
    /* Ao encerrar no meio, as cartas sem resposta voltam ao começo do baralho (como as erradas). */
    function markUnanswered() {
      if (isVirtual(deck.id)) return;
      cards.forEach(function (c) {
        if (results[c.id]) return;
        if (!(c.id in prevLv)) prevLv[c.id] = c.lv | 0;
        setLv(c, 0);
      });
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { saveTimer = null; saveDeck(deck); }, 800);
    }
    function resume() {
      var had = Object.keys(prevLv).length > 0;
      cards.forEach(function (c) { if (c.id in prevLv) setLv(c, prevLv[c.id]); });
      prevLv = {}; ended = false;
      if (had && !isVirtual(deck.id)) {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () { saveTimer = null; saveDeck(deck); }, 800);
      }
    }
    /* Sair no meio do baralho mostra o resultado em vez de descartar o que foi feito. */
    function stopEarly() {
      if (mode !== 'baralho' || ended || pos <= 0 || pos >= order.length) return false;
      ended = true; markUnanswered(); paint(); window.scrollTo(0, 0);
      return true;
    }

    if (mode === 'baralho') app.style.setProperty('--reserve', '392px');

    var counter = h('div', { class: 'label' });
    var led = h('span', { class: 'led' });
    var sideBtn;
    if (mode === 'baralho') {
      sideBtn = h('button', { class: 'led-toggle', 'aria-pressed': 'true', onclick: function () {
        shuffled = !shuffled;
        resume();
        order = shuffled ? smartOrder() : natural;
        pos = 0; results = {}; paint();
      } }, led, 'Aleatório');
    } else {
      sideBtn = h('button', { class: 'led-toggle', onclick: function () {
        seq = pageSeq(); paint();
      } }, 'Espalhar de novo');
    }
    var body = h('div', { class: 'study-body' });
    var relayout = null;
    if (mode === 'mesa') {
      var onRes = function () { if (relayout) relayout(); };
      window.addEventListener('resize', onRes);
      viewCleanup = function () { window.removeEventListener('resize', onRes); };
    }
    var allBtn = mode === 'mesa' ? h('button', { class: 'led-toggle' }, 'Virar todas') : null;
    var libItem = deck._lib || null;
    var backB = libItem
      ? backBtn('Voltar à biblioteca', function () { if (stopEarly()) return; flushLevels(); go('library', { area: libItem.area }); })
      : backBtn('Voltar aos decks', function () { if (stopEarly()) return; go('home'); });
    var dlBtn = null;
    function downloadBtn(cls) {
      var b = h('button', { class: cls }, libOwned(libItem) ? 'Baixar outra cópia' : 'Baixar');
      b.addEventListener('click', function () {
        saveDeck(libCopy(libItem));
        toast('Deck nos seus decks.');
        b.textContent = 'Baixar outra cópia';
      });
      return b;
    }
    var titleB = h('div', { class: 'grow' }, counter, h('div', { class: 'bar-title' }, deck.name));

    /* Atalho entre os dois modos de estudo, sem passar pela escolha de novo. */
    function modeBtn(m, label) {
      return h('button', { 'aria-pressed': String(mode === m), onclick: function () {
        if (mode === m) return;
        flushLevels();
        go('study', { deckId: deck.id, mode: m, only: review ? state.only : undefined });
      } }, label);
    }
    var DIRS = { normal: 'Normal', rev: 'Invertido', mix: 'Misto' };
    var dirBtn = h('button', { class: 'led-toggle', style: 'min-height:36px;padding:0 6px', 'aria-label': 'Sentido do estudo: ' + DIRS[dir] + '. Toque para mudar.', onclick: function () {
      flushLevels();
      var next = dir === 'normal' ? 'rev' : (dir === 'rev' ? 'mix' : 'normal');
      dirSession = { deckId: deck.id, dir: next };
      go('study', { deckId: deck.id, mode: mode, only: review ? state.only : undefined });
    } }, 'Sentido: ', h('b', { style: 'font-weight:500;color:var(--ink);border-bottom:1px dotted var(--ink-2)' }, DIRS[dir]));
    var modeRow = h('div', { class: 'modeswitch' }, h('div', { class: 'seg', role: 'group', 'aria-label': 'Modo de estudo' }, modeBtn('mesa', 'Mesa'), modeBtn('baralho', 'Baralho')), dirBtn);
    if (libItem) modeRow.append(downloadBtn('led-toggle dl'));
    var testRow = '';
    if (deck.id === TEST_ID) {
      var setN = function (k) {
        var cur = testDeck.cards.length, nn = Math.max(1, Math.min(60, cur + k));
        testDeck.cards = testCards(nn);
        render();
      };
      testRow = h('div', { class: 'modeswitch test-row' },
        h('button', { class: 'led-toggle', 'aria-label': 'Tirar uma carta', onclick: function () { setN(-1); } }, '− 1'),
        h('span', { class: 'label pos', 'aria-live': 'polite' }, testDeck.cards.length + (testDeck.cards.length === 1 ? ' carta' : ' cartas')),
        h('button', { class: 'btn primary', style: 'min-height:44px;padding:0 20px', 'aria-label': 'Somar uma carta', onclick: function () { setN(1); } }, '+ 1'),
        h('button', { class: 'led-toggle', 'aria-label': 'Somar cinco cartas', onclick: function () { setN(5); } }, '+ 5'));
    }

    app.append(
      mode === 'mesa'
        ? h('div', { class: 'bar mesa' }, h('div', { class: 'bar-left' }, backB, titleB), allBtn, h('div', { class: 'bar-right' }, sideBtn))
        : h('div', { class: 'bar' }, backB, titleB, sideBtn),
      modeRow,
      testRow,
      body
    );

    function tally() {
      var ok = 0, no = 0, wrong = [], left = [];
      cards.forEach(function (c) {
        if (results[c.id] === 'ok') ok++;
        else if (results[c.id] === 'no') { no++; wrong.push(c.id); }
        else left.push(c.id);
      });
      return { ok: ok, no: no, wrong: wrong, left: left };
    }

    function resultsEl() {
      var t = tally();
      var nl = t.left.length;
      var allRight = t.no === 0 && nl === 0;
      var actions = h('div', { class: 'row-actions res-actions' });
      if (nl > 0) {
        actions.append(
          h('button', { class: 'btn primary', onclick: function () { resume(); paint(); } }, 'Continuar de onde parei (' + nl + (nl === 1 ? ' carta)' : ' cartas)'))
        );
      } else if (!allRight) {
        actions.append(h('button', { class: 'btn primary', onclick: function () {
          go('study', { deckId: deck.id, mode: mode, only: t.wrong });
        } }, 'Revisar as ' + t.no + (t.no === 1 ? ' errada' : ' erradas')));
      }
      actions.append(
        h('button', { class: 'btn', onclick: function () { go('study', { deckId: deck.id, mode: mode }); } }, review ? 'Estudar o deck todo' : 'Estudar de novo'),
        libItem ? downloadBtn('btn') : '',
        h('button', { class: 'btn', style: libItem ? 'grid-column: 1 / -1' : null, onclick: function () { if (libItem) go('library', { area: libItem.area }); else go('home'); } }, libItem ? 'Voltar à biblioteca' : 'Voltar aos decks')
      );
      return h('div', { class: 'panel', id: 'resultado' },
        h('div', { class: 'label' }, review ? 'Resultado da revisão' : 'Resultado'),
        h('h2', null, nl > 0 ? ('Você parou em ' + (t.ok + t.no) + ' de ' + n) : (allRight ? 'Você acertou todas' : (t.ok + ' de ' + n + (t.ok === 1 ? ' certa' : ' certas')))),
        h('div', { class: 'score' + (nl > 0 ? ' three' : '') },
          h('div', { class: 'stat ok' }, h('b', null, String(t.ok)), h('span', { class: 'label' }, 'Acertos')),
          h('div', { class: 'stat' }, h('b', null, String(t.no)), h('span', { class: 'label' }, 'Erros')),
          nl > 0 ? h('div', { class: 'stat' }, h('b', null, String(nl)), h('span', { class: 'label' }, 'Sem responder')) : ''
        ),
        nl > 0 && !isVirtual(deck.id) ? h('p', { class: 'hint', style: 'margin-top:0' }, 'As cartas sem resposta voltam para o começo do baralho na próxima vez.') : '',
        actions
      );
    }

    function paintDeck() {
      if (ended || pos >= order.length) { body.append(resultsEl()); return; }
      var c = cards[order[pos]];
      var revealed = false;
      var yes = h('button', { class: 'btn wide primary', disabled: true, onclick: function () { results[c.id] = 'ok'; rate(c, true); buzz(10); pos++; paint(); } }, 'Acertei');
      var no = h('button', { class: 'btn wide', disabled: true, onclick: function () { results[c.id] = 'no'; rate(c, false); buzz([14, 40, 14]); pos++; paint(); } }, 'Errei');
      var cb = cardBlock(c, function (f) {
        if (f && !revealed) { revealed = true; yes.disabled = false; no.disabled = false; }
      });
      body.append(
        cb.stage,
        h('div', { class: 'marks-row' }, no, yes)
      );
    }

    function closeZoom(now) {
      var z = document.getElementById('zoom');
      if (!z) return;
      var back = z._from;
      if (now) z.remove(); else { z.classList.add('out'); setTimeout(function () { z.remove(); }, 160); }
      try { if (back && back.isConnected) back.focus({ preventScroll: true }); } catch (e) {}
    }
    function openZoom(c, ctl, cell) {
      closeZoom(true);
      var side = ctl.on ? c.a : c.q;
      var card = h('div', { class: 'zoomcard' }, h('div', { class: 'face-label' }, ctl.on ? 'Resposta' : 'Pergunta'), content(side));
      var t0 = Date.now();
      var z = h('div', { class: 'zoom', id: 'zoom', role: 'dialog', 'aria-label': 'Carta ampliada. Toque para fechar.', tabindex: '-1',
        onclick: function () { if (Date.now() - t0 > 250) closeZoom(); } }, card);
      z._from = cell;
      document.body.appendChild(z);
      try { z.focus({ preventScroll: true }); } catch (e) {}
    }
    document.addEventListener('keydown', function onEsc(e) {
      if (!document.getElementById('zoom')) { if (!document.querySelector('.table')) document.removeEventListener('keydown', onEsc); return; }
      if (e.key === 'Escape') closeZoom();
    });

    function paintTable() {
      var grid = h('div', { class: 'table' });
      var cells = [], cells_el = [];
      allBtn.textContent = 'Virar todas';
      function syncAll() {
        allBtn.textContent = cells.every(function (x) { return x.on; }) ? 'Desvirar todas' : 'Virar todas';
      }
      counter.textContent = n + (n === 1 ? ' carta' : ' cartas');
      seq.forEach(function (ci) {
        var c = cards[ci];
        var front = h('div', { class: 'face front' }); front.append(content(c.q));
        var back = h('div', { class: 'face back' });
        var ans = h('div', { class: 'ans' + (c.a && c.a.kind === 'draw' ? ' draw' : '') }); ans.append(content(c.a));
        back.append(ans);
        var flip = h('div', { class: 'flip' }, front, back);
        var cell = h('button', { class: 'mini', 'aria-label': 'Carta da mesa. Toque para ver a resposta.' }, flip);
        /* Cada carta cai um pouco fora do lugar; a posição final em px é calculada no layoutGrid. */
        cell._j = { rot: (Math.random() * 2 - 1) * 5.5, dx: (Math.random() * 2 - 1) * 0.08, dy: (Math.random() * 2 - 1) * 0.07 };
        cells_el.push(cell);
        back.setAttribute('aria-hidden', 'true');
        var ctl = { on: false };
        ctl.set = function (v) {
          ctl.on = v;
          flip.classList.toggle('is-flipped', v);
          front.setAttribute('aria-hidden', String(v));
          back.setAttribute('aria-hidden', String(!v));
          cell.setAttribute('aria-label', v ? 'Resposta da carta. Toque para voltar à pergunta.' : 'Carta da mesa. Toque para ver a resposta.');
        };
        cell.addEventListener('click', function () { if (cell._lp) { cell._lp = false; return; } ctl.set(!ctl.on); syncAll(); });
        var lpT = null, lx = 0, ly = 0;
        function lpStop() { clearTimeout(lpT); lpT = null; }
        cell.addEventListener('pointerdown', function (e) {
          if (e.button > 0) return;
          lx = e.clientX; ly = e.clientY; cell._lp = false; clearTimeout(lpT);
          lpT = setTimeout(function () { lpT = null; cell._lp = true; openZoom(c, ctl, cell); buzz(12); }, 450);
        });
        cell.addEventListener('pointermove', function (e) { if (lpT && Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly) > 10) lpStop(); });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { cell.addEventListener(ev, lpStop); });
        cell.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        cells.push(ctl);
        grid.append(cell);
      });
      allBtn.onclick = function () {
        var target = !cells.every(function (x) { return x.on; });
        cells.forEach(function (x) { x.set(target); });
        syncAll();
      };
      if (mesaPages > 1) {
        var from = mesaPage * MESA_MAX + 1, to = Math.min(n, (mesaPage + 1) * MESA_MAX);
        var goPage = function (d) { mesaPage = Math.max(0, Math.min(mesaPages - 1, mesaPage + d)); seq = pageSeq(); paint(); window.scrollTo(0, 0); };
        body.append(h('div', { class: 'modeswitch pager' },
          h('button', { class: 'led-toggle', disabled: mesaPage === 0, 'aria-label': 'Mesa anterior', onclick: function () { goPage(-1); } }, '‹ Anterior'),
          h('span', { class: 'label pos', 'aria-live': 'polite' }, 'Mesa ' + (mesaPage + 1) + ' de ' + mesaPages + ' · ' + from + '–' + to),
          h('button', { class: 'led-toggle', disabled: mesaPage === mesaPages - 1, 'aria-label': 'Próxima mesa', onclick: function () { goPage(1); } }, 'Próxima ›')));
      }
      body.append(grid);
      /* Todas as cartas cabem na tela, sempre do mesmo tamanho. */
      function layoutGrid() {
        var W = grid.clientWidth;
        if (!W) return;
        var top = grid.getBoundingClientRect().top + window.scrollY;
        var cs = getComputedStyle(document.documentElement), bs = getComputedStyle(document.body);
        var bottom = (parseFloat(cs.paddingBottom) || 0) + (parseFloat(bs.paddingBottom) || 0);
        var Hh = window.innerHeight - top - bottom;
        var m = seq.length;
        var g = m > 20 ? 3 : (m > 9 ? 5 : 8);
        var best = 0, bc = 1;
        for (var c = 1; c <= m; c++) {
          var rows = Math.ceil(m / c);
          var w = Math.min((W - (c - 1) * g) / c, ((Hh - (rows - 1) * g) / rows) * 0.8);
          if (w > best) { best = w; bc = c; }
        }
        if (best < 8) best = 8;
        /* Cartas um pouco menores que a célula, soltas sobre a mesa; a última fileira incompleta fica centrada. */
        var cw = Math.floor(best);
        var rowsN = Math.ceil(m / bc), missing = rowsN * bc - m;
        grid.style.gridTemplateColumns = 'repeat(' + bc + ', ' + cw + 'px)';
        grid.style.gap = g + 'px';
        cells_el.forEach(function (el, i) {
          var j = el._j, inLast = i >= (rowsN - 1) * bc;
          var cx = inLast ? missing * (cw + g) / 2 : 0;
          el.style.transform = 'translate(' + (cx + j.dx * cw).toFixed(1) + 'px, ' + (j.dy * cw).toFixed(1) + 'px) rotate(' + j.rot.toFixed(2) + 'deg) scale(0.97)';
        });
      }
      relayout = layoutGrid;
      layoutGrid();
      watch(grid, layoutGrid);
    }

    function paint() {
      closeZoom(true); clearWatch(); body.replaceChildren();
      if (mode === 'baralho') {
        sideBtn.setAttribute('aria-pressed', String(shuffled));
        led.classList.toggle('on', shuffled);
        var prefix = review ? 'Revisão · ' : '';
        counter.textContent = n ? ((pos >= n || ended) ? prefix + 'Resultado' : prefix + (pos + 1) + ' / ' + n) : 'Sem cartas';
      }
      if (allBtn) allBtn.disabled = !n;
      if (!n) {
        body.append(h('div', { class: 'panel' },
          h('h2', null, 'Este deck ainda não tem cartas'),
          h('p', null, 'Adicione a primeira: desenhe com o dedo ou digite.'),
          h('div', { class: 'row-actions' },
            h('button', { class: 'btn primary', onclick: function () { go('edit', { deckId: deck.id, cardId: null }); } }, 'Adicionar carta'))
        ));
        return;
      }
      if (mode === 'mesa') paintTable(); else paintDeck();
    }
    paint();
  }

  /* ---------- compartilhar e importar ---------- */
  var AUTHOR_KEY = 'cartas-a-mao-autor';
  var CODE_PREFIX = 'CARTAS1.';
  function encodeDeck(deck) {
    var payload = { v: 1, name: deck.name, author: deck.author || '', cards: deck.cards.map(function (c) { return { q: c.q, a: c.a }; }) };
    return CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  }
  function cleanSideIn(side) {
    if (!side || typeof side !== 'object') return null;
    if (side.kind === 'text' && typeof side.text === 'string') return { kind: 'text', text: side.text.slice(0, 2000) };
    if (side.kind === 'image' && typeof side.src === 'string' && side.src.length <= 250000 && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(side.src)) {
      return { kind: 'image', src: side.src };
    }
    if (side.kind === 'draw' && Array.isArray(side.strokes) && side.strokes.length <= 400) {
      var out = [], total = 0;
      for (var i = 0; i < side.strokes.length; i++) {
        var st0 = side.strokes[i];
        var st = Array.isArray(st0) ? st0 : (st0 && typeof st0 === 'object' ? st0.p : null);
        if (!Array.isArray(st) || st.length < 2 || st.length > 20000) return null;
        var row = [];
        for (var j = 0; j < st.length; j++) {
          var v = Number(st[j]);
          if (!isFinite(v)) return null;
          row.push(Math.max(0, Math.min(1250, Math.round(v))));
        }
        total += row.length;
        if (total > 300000) return null;
        var ck = 'k', wk = 2;
        if (!Array.isArray(st0)) {
          ck = COLORS.some(function (c) { return c.k === st0.c; }) ? st0.c : 'k';
          wk = st0.w === 1 || st0.w === 3 ? st0.w : 2;
        }
        out.push(ck === 'k' && wk === 2 ? row : { p: row, c: ck, w: wk });
      }
      return { kind: 'draw', strokes: out };
    }
    return null;
  }
  function decodeDeck(code) {
    try {
      var t = String(code || '').trim(), obj;
      if (t.charAt(0) === '{') obj = JSON.parse(t);
      else {
        t = t.replace(/\s+/g, '');
        if (t.indexOf(CODE_PREFIX) !== 0) return null;
        obj = JSON.parse(decodeURIComponent(escape(atob(t.slice(CODE_PREFIX.length)))));
      }
      if (!obj || obj.v !== 1 || typeof obj.name !== 'string' || !Array.isArray(obj.cards) || obj.cards.length > 500) return null;
      var cards = [];
      for (var i = 0; i < obj.cards.length; i++) {
        var q = cleanSideIn(obj.cards[i] && obj.cards[i].q), a = cleanSideIn(obj.cards[i] && obj.cards[i].a);
        if (!q || !a) return null;
